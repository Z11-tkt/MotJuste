<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Trouve le genre et la classe grammaticale d'un mot français.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>MotJuste</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#1a2940;--line:#2a3a53;--text:#f4f7fb;--muted:#9aabc1;--blue:#72a7ff;--green:#76dfb0;--yellow:#ffd27b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#203a60 0%,var(--bg) 55%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center}
    main{width:min(100%,560px);padding: max(34px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh}
    header{text-align:center;margin:36px 0 42px} .logo{font-size:34px;font-weight:850;letter-spacing:-1.5px}.logo span{color:var(--blue)} .tagline{color:var(--muted);font-size:14px;margin-top:7px}
    .search-label{display:block;font-size:12px;font-weight:750;letter-spacing:1.2px;color:var(--muted);margin:0 0 10px 4px}
    .search-wrap{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:0 16px 45px #0003}
    input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:17px;padding:12px 10px}input::placeholder{color:#71839c}
    button{border:0;border-radius:13px;background:var(--blue);color:#0b1627;font-weight:800;font-size:14px;padding:0 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .hint{color:var(--muted);font-size:12px;margin:11px 4px 0;line-height:1.5}
    #suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.suggestion{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px}
    #result{margin-top:24px}.result-card{background:linear-gradient(145deg,#18283e,#111c2d);border:1px solid var(--line);border-radius:22px;padding:23px;box-shadow:0 16px 45px #0002}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
    .answer{font-size:clamp(29px,8vw,42px);font-weight:850;letter-spacing:-1.2px;margin:9px 0 12px;overflow-wrap:anywhere}
    .pills{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;font-weight:750;padding:7px 10px;border-radius:999px;background:#213b5c;color:#bcd7ff}.pill.green{background:#173b34;color:var(--green)}
    .detail{color:var(--muted);font-size:13px;line-height:1.55;margin-top:17px}
    .notice{margin-top:14px;color:var(--yellow);font-size:12px;line-height:1.5}
    .status{min-height:22px;color:var(--muted);font-size:13px;margin:16px 4px}
    footer{margin-top:auto;padding-top:42px;text-align:center;color:#71839c;font-size:11px;line-height:1.6}
    .examples{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}.example{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 11px;border-radius:999px;font-size:12px}
    @media(min-height:760px){header{margin-top:60px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="logo">Mot<span>Juste</span></div>
    <div class="tagline">Le français sans hésitation</div>
  </header>

  <section>
    <label class="search-label" for="word">ÉCRIS UN MOT</label>
    <div class="search-wrap">
      <input id="word" type="search" placeholder="Ex : voiture, courir, rapide…" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button id="searchBtn" type="button">Chercher</button>
    </div>
    <p class="hint">Le genre, la classe grammaticale et des suggestions si le mot semble mal orthographié.</p>
    <div id="suggestions" aria-live="polite"></div>
    <div id="status" class="status" aria-live="polite"></div>
    <div id="result" aria-live="polite"></div>
    <div class="examples">
      <button class="example" data-word="voiture">voiture</button>
      <button class="example" data-word="courir">courir</button>
      <button class="example" data-word="rapide">rapide</button>
    </div>
  </section>

  <footer>Les définitions et informations lexicales proviennent de Wiktionnaire.<br>Une vérification reste utile pour les mots rares ou à plusieurs sens.</footer>
</main>
<script>
const input = document.getElementById('word');
const button = document.getElementById('searchBtn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const suggestionsEl = document.getElementById('suggestions');

const API = 'https://fr.wiktionary.org/w/api.php';
const clean = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function setStatus(s){statusEl.textContent=s}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(params){
  const url = API + '?' + new URLSearchParams({...params,format:'json',origin:'*'});
  const r = await fetch(url);
  if(!r.ok) throw new Error('Réponse réseau indisponible');
  return r.json();
}
function extractParts(wikitext){
  const sections = [];
  const heading = /^={3}\s*(.*?)\s*={3}\s*$/gm;
  let match, last = null, lastIndex = 0;
  while((match=heading.exec(wikitext))){
    if(last) sections.push({title:last, body:wikitext.slice(lastIndex,match.index)});
    last=match[1]; lastIndex=heading.lastIndex;
  }
  if(last) sections.push({title:last,body:wikitext.slice(lastIndex)});
  return sections;
}
function classify(title){
  const t=title.toLowerCase();
  const map=[
    [/nom|substantif/,'Nom commun'],[/verbe/,'Verbe'],[/adjectif/,'Adjectif'],[/adverbe/,'Adverbe'],
    [/pronom/,'Pronom'],[/déterminant|article/,'Déterminant'],[/préposition/,'Préposition'],
    [/conjonction/,'Conjonction'],[/interjection/,'Interjection'],[/onomatopée/,'Onomatopée'],
    [/numéral/,'Numéral']
  ];
  for(const [re,label] of map) if(re.test(t)) return label;
  return null;
}
function genderFrom(body){
  const templates=[...body.matchAll(/\{\{(?:fr-)?nom(?:-flexion)?\s*\|([^}\n]*)\}\}/gi)];
  for(const m of templates){
    const args=m[1].split('|').map(x=>x.trim().toLowerCase());
    if(args.includes('m') || args.includes('mf')) return args.includes('mf')?'masculin ou féminin':'masculin';
    if(args.includes('f')) return 'féminin';
  }
  if(/\{\{(?:m|mf)\}\}/.test(body)) return 'masculin';
  if(/\{\{f\}\}/.test(body)) return 'féminin';
  return null;
}
function renderResult(word, parts, exact){
  const found=[];
  for(const p of parts){
    const c=classify(p.title);
    if(c && !found.some(x=>x.cls===c)){
      found.push({cls:c,gender:c==='Nom commun'?genderFrom(p.body):null});
    }
  }
  if(!found.length){
    resultEl.innerHTML=`<div class="result-card"><div class="eyebrow">Résultat</div><div class="answer">${esc(word)}</div><div class="pills"><span class="pill">Classe grammaticale non trouvée</span></div><p class="detail">Le Wiktionnaire ne fournit pas de rubrique grammaticale française clairement détectable pour ce mot.</p></div>`;
    return;
  }
  const cards=found.map(x=>{
    const noun=x.cls==='Nom commun';
    const prefix=x.gender==='féminin'?'Une ':x.gender==='masculin'?'Un ':'';
    const title=noun && x.gender ? prefix+word : word;
    return `<div class="result-card" style="margin-bottom:12px"><div class="eyebrow">Résultat</div><div class="answer">${esc(title)}</div><div class="pills"><span class="pill ${noun?'green':''}">${esc(x.cls)}</span>${x.gender?`<span class="pill">${esc(x.gender)}</span>`:''}</div>${noun&&!x.gender?'<p class="notice">Genre non confirmé automatiquement : vérifie le sens du mot.</p>':''}</div>`;
  }).join('');
  resultEl.innerHTML=cards;
}
async function suggest(word){
  try{
    const data=await api({action:'opensearch',search:word,limit:7,namespace:0});
    const list=(data[1]||[]).filter(x=>clean(x)!==clean(word)).slice(0,6);
    suggestionsEl.innerHTML=list.map(x=>`<button class="suggestion" type="button" data-pick="${esc(x)}">${esc(x)}</button>`).join('');
  }catch(e){suggestionsEl.innerHTML=''}
}
async function searchWord(raw){
  const word=raw.trim().replace(/\s+/g,' ');
  if(!word){setStatus('Écris un mot pour commencer.');return}
  if(word.length>70){setStatus('Entre un mot ou une expression courte.');return}
  button.disabled=true; suggestionsEl.innerHTML=''; resultEl.innerHTML='';
  setStatus('Recherche en cours…');
  try{
    const data=await api({action:'parse',page:word,prop:'wikitext'});
    if(data.error || !data.parse?.wikitext?.['*']){
      setStatus('Mot introuvable. Voici quelques mots proches :');
      await suggest(word);
      return;
    }
    const wt=data.parse.wikitext['*'];
    const frStart=wt.search(/==\s*\{\{(?:langue|lang)\|fr\}\}\s*==/i);
    let frText=frStart>=0?wt.slice(frStart):wt;
    const parts=extractParts(frText);
    if(!parts.length){
      setStatus('Page trouvée, mais classe grammaticale non détectée.');
    }else{
      setStatus('');
    }
    renderResult(word,parts,true);
    await suggest(word);
  }catch(e){
    setStatus('Connexion impossible. Vérifie ta connexion internet puis réessaie.');
  }finally{button.disabled=false}
}
button.addEventListener('click',()=>searchWord(input.value));
input.addEventListener('keydown',e=>{if(e.key==='Enter')searchWord(input.value)});
document.querySelectorAll('.example').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.word;searchWord(input.value)}));
suggestionsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-pick]');
  if(b){input.value=b.dataset.pick;searchWord(input.value)}
});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
