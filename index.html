

<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#090e1c">

<meta name="description" content="MotJuste - Trouve le genre et la classe grammaticale des mots français.">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="icon.svg">

<title>MotJuste</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');

:root {

  --bg:#090e1c;

  --panel:#111a2d;

  --blue:#719bff;

  --cyan:#64d9e9;

  --white:#f4f7ff;

  --muted:#8c9bb5;

  --green:#69e2b1;

}

* {box-sizing:border-box}

body {

  margin:0;

  min-height:100vh;

  font-family:'DM Sans',sans-serif;

  color:var(--white);

  background:

    radial-gradient(ellipse at 50% -15%,#243b70 0%,transparent 50%),

    radial-gradient(circle at 100% 65%,#102b43 0%,transparent 35%),

    var(--bg);

  overflow-x:hidden;

}

body:before {

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.12;

  background-image:radial-gradient(#9bbcff 0.7px,transparent 0.7px);

  background-size:25px 25px;

}

.orb {

  position:fixed;

  width:240px;

  height:240px;

  border-radius:50%;

  filter:blur(90px);

  opacity:.15;

  pointer-events:none;

  animation:float 9s ease-in-out infinite alternate;

}

.orb.one {background:#397aff;top:15%;left:-150px}

.orb.two {background:#24b8d3;bottom:5%;right:-160px;animation-delay:2s}

@keyframes float {

  from {transform:translateY(-20px)}

  to {transform:translateY(35px)}

}

main {

  width:min(100%,560px);

  min-height:100vh;

  margin:auto;

  padding:55px 23px 30px;

  position:relative;

  display:flex;

  flex-direction:column;

}

header {

  text-align:center;

  margin-bottom:66px;

  animation:appear .8s ease both;

}

.logo {

  font-family:'Manrope',sans-serif;

  font-size:39px;

  font-weight:800;

  letter-spacing:-2px;

}

.logo span {

  background:linear-gradient(100deg,#80aaff,#62dce5);

  -webkit-background-clip:text;

  color:transparent;

}

.logo-icon {

  display:inline-flex;

  width:37px;

  height:37px;

  align-items:center;

  justify-content:center;

  border-radius:12px;

  background:linear-gradient(140deg,#739eff,#4ac8e4);

  color:#071426;

  font-size:21px;

  margin-right:7px;

  vertical-align:3px;

  box-shadow:0 5px 25px #4b8eff55;

}

.tagline {

  color:var(--muted);

  font-size:13px;

  margin-top:8px;

  letter-spacing:.5px;

}

.search-area {

  animation:appear .8s .15s ease both;

}

.label {

  font-size:11px;

  font-weight:800;

  letter-spacing:1.7px;

  color:#a4b5d2;

  margin:0 0 13px 5px;

}

.search-box {

  display:flex;

  align-items:center;

  gap:8px;

  padding:7px;

  border-radius:19px;

  background:#111b2e;

  border:1px solid #304360;

  box-shadow:0 12px 45px #0005,0 0 0 1px #ffffff05;

  transition:.3s;

}

.search-box:focus-within {

  border-color:#719bff;

  box-shadow:0 0 0 4px #719bff19,0 12px 45px #0005;

}

input {

  flex:1;

  min-width:0;

  padding:15px 12px;

  border:0;

  outline:0;

  background:transparent;

  color:white;

  font:500 16px 'DM Sans',sans-serif;

}

input::placeholder {color:#71809b}

.search-btn {

  border:0;

  border-radius:13px;

  padding:14px 17px;

  color:#091426;

  font-weight:800;

  font-size:13px;

  background:linear-gradient(110deg,#80aaff,#65d7e6);

  cursor:pointer;

  transition:.2s;

  box-shadow:0 4px 18px #719bff30;

}

.search-btn:active {transform:scale(.94)}

.search-btn:disabled {opacity:.6}

.hint {

  margin:12px 4px 0;

  color:#8090aa;

  font-size:12px;

  line-height:1.5;

}

#status {

  min-height:22px;

  margin:20px 4px 0;

  font-size:13px;

  color:var(--muted);

}

#result {

  margin-top:8px;

}

.result-card {

  position:relative;

  overflow:hidden;

  padding:25px 22px;

  border-radius:23px;

  border:1px solid #344765;

  background:linear-gradient(145deg,#192942,#111b2d);

  box-shadow:0 20px 55px #0003;

  animation:resultIn .5s cubic-bezier(.2,.8,.2,1) both;

}

.result-card:before {

  content:"";

  position:absolute;

  width:180px;

  height:180px;

  right:-90px;

  top:-110px;

  background:#699cff;

  filter:blur(80px);

  opacity:.2;

}

.result-label {

  color:#91a8cb;

  font-size:10px;

  letter-spacing:1.8px;

  font-weight:800;

  text-transform:uppercase;

}

.answer {

  font-family:'Manrope',sans-serif;

  font-size:clamp(30px,8vw,42px);

  font-weight:800;

  letter-spacing:-1.5px;

  margin:12px 0 16px;

  overflow-wrap:anywhere;

}

.pills {

  display:flex;

  flex-wrap:wrap;

  gap:9px;

}

.pill {

  padding:8px 12px;

  border-radius:30px;

  font-size:12px;

  font-weight:700;

  background:#243b5d;

  color:#bcd5ff;

  border:1px solid #38547c;

}

.pill.green {

  background:#173b34;

  color:var(--green);

  border-color:#286c57;

}

.detail {

  color:#91a1bb;

  font-size:12px;

  line-height:1.6;

  margin-top:17px;

}

#suggestions {

  display:flex;

  flex-wrap:wrap;

  gap:9px;

  margin-top:13px;

}

.suggestion {

  padding:9px 14px;

  border-radius:30px;

  background:#17243a;

  color:#b9c9e2;

  border:1px solid #304360;

  font:600 12px 'DM Sans',sans-serif;

  cursor:pointer;

  transition:.2s;

}

.suggestion:active {

  transform:scale(.94);

  background:#293e61;

}

.examples {

  margin-top:30px;

}

.examples-title {

  color:#72839f;

  font-size:10px;

  font-weight:800;

  letter-spacing:1.5px;

  margin-bottom:12px;

}

.example-list {

  display:flex;

  flex-wrap:wrap;

  gap:9px;

}

.example {

  background:#131e31;

  color:#9fb0cc;

  border:1px solid #283b57;

  padding:10px 14px;

  border-radius:12px;

  font-size:12px;

  cursor:pointer;

  transition:.2s;

}

.example:active {transform:scale(.94)}

footer {

  margin-top:auto;

  padding-top:55px;

  text-align:center;

  font-size:11px;

  line-height:1.7;

  color:#63738e;

}

.loader {

  width:19px;

  height:19px;

  border:2px solid #ffffff25;

  border-top-color:#80aaff;

  border-radius:50%;

  display:inline-block;

  animation:spin .7s linear infinite;

  vertical-align:middle;

  margin-right:8px;

}

@keyframes spin {to{transform:rotate(360deg)}}

@keyframes appear {

  from {opacity:0;transform:translateY(18px)}

  to {opacity:1;transform:translateY(0)}

}

@keyframes resultIn {

  from {opacity:0;transform:translateY(15px) scale(.98)}

  to {opacity:1;transform:translateY(0) scale(1)}

}

@media(max-width:380px) {

  main {padding-left:17px;padding-right:17px}

  .search-btn {padding:13px}

  header {margin-bottom:48px}

}

</style>

</head>

<body>

<div class="orb one"></div>

<div class="orb two"></div>

<main>

<header>

  <div class="logo">

    <span class="logo-icon">M</span>Mot<span>Juste</span>

  </div>

  <div class="tagline">Le français sans hésitation.</div>

</header>

<section class="search-area">

<div class="label">QUEL MOT RECHERCHES-TU ?</div>

<div class="search-box">

  <input id="word" type="search"

    placeholder="Écris un mot..."

    autocomplete="off"

    spellcheck="false">

  <button class="search-btn" id="searchBtn">Chercher ↗</button>

</div>

<div class="hint">

  Découvre le genre et la classe grammaticale de tes mots.

</div>

<div id="status" aria-live="polite"></div>

<div id="suggestions"></div>

<div id="result" aria-live="polite"></div>

<div class="examples">

  <div class="examples-title">ESSAYER UN MOT</div>

  <div class="example-list">

    <button class="example" data-word="voiture">voiture</button>

    <button class="example" data-word="soleil">soleil</button>

    <button class="example" data-word="courir">courir</button>

    <button class="example" data-word="rapide">rapide</button>

  </div>

</div>

</section>

<footer>

  <strong style="color:#8ca9d5">MotJuste</strong><br>

  Comprendre les mots, simplement.<br>

  Les résultats sont issus du Wiktionnaire.

</footer>

</main>

<script>

const input = document.getElementById('word');

const button = document.getElementById('searchBtn');

const status = document.getElementById('status');

const result = document.getElementById('result');

const suggestions = document.getElementById('suggestions');

const API = 'https://fr.wiktionary.org/w/api.php';

const knownWords = {

  voiture:{type:'Nom commun',gender:'féminin'},

  maison:{type:'Nom commun',gender:'féminin'},

  table:{type:'Nom commun',gender:'féminin'},

  école:{type:'Nom commun',gender:'féminin'},

  voiture:{type:'Nom commun',gender:'féminin'},

  soleil:{type:'Nom commun',gender:'masculin'},

  livre:{type:'Nom commun',gender:'masculin'},

  chat:{type:'Nom commun',gender:'masculin'},

  chien:{type:'Nom commun',gender:'masculin'},

  eau:{type:'Nom commun',gender:'féminin'},

  ordinateur:{type:'Nom commun',gender:'masculin'},

  maison:{type:'Nom commun',gender:'féminin'},

  courir:{type:'Verbe'},

  manger:{type:'Verbe'},

  dormir:{type:'Verbe'},

  rapide:{type:'Adjectif'},

  magnifique:{type:'Adjectif'},

  heureux:{type:'Adjectif'},

  lentement:{type:'Adverbe'}

};

function escapeHTML(s){

  return s.replace(/[&<>"']/g,c=>({

    '&':'&amp;','<':'&lt;','>':'&gt;',

    '"':'&quot;',"'":'&#39;'

  }[c]));

}

function normalize(s){

  return s.normalize('NFD')

    .replace(/[\u0300-\u036f]/g,'')

    .toLowerCase().trim();

}

async function api(params){

  const url=API+'?'+new URLSearchParams({

    ...params,format:'json',origin:'*'

  });

  const response=await fetch(url);

  if(!response.ok) throw new Error('Erreur réseau');

  return response.json();

}

function frenchSection(wt){

  const match=wt.match(

    /^==\s*\{\{\s*langue\s*\|\s*fr\s*\}\}\s*==\s*$/im

  );

  if(!match) return null;

  const start=match.index+match[0].length;

  const rest=wt.slice(start);

  const next=rest.search(/^==[^=].*==\s*$/m);

  return next<0?rest:rest.slice(0,next);

}

function getFirstFrenchClass(section){

  if(!section) return null;

  const headings=[...section.matchAll(

    /^===\s*(.*?)\s*===\s*$/gm

  )];

  for(let i=0;i<headings.length;i++){

    const heading=headings[i][1];

    let type=null;

    const modern=heading.match(

      /\{\{\s*S\s*\|\s*([^|}]+)\s*\|\s*fr\s*\}\}/i

    );

    const legacy=heading.match(/\{\{\s*-([a-z-]+)-\s*\}\}/i);

    const raw=(modern?.[1]||legacy?.[1]||'').toLowerCase().trim();

    const types={

      nom:'Nom commun',

      substantif:'Nom commun',

      verbe:'Verbe',

      adjectif:'Adjectif',

      adverbe:'Adverbe',

      pronom:'Pronom',

      déterminant:'Déterminant',

      article:'Déterminant',

      préposition:'Préposition',

      conjonction:'Conjonction',

      interjection:'Interjection',

      onomatopée:'Onomatopée',

      numéral:'Numéral'

    };

    type=types[raw];

    if(type){

      const bodyStart=headings[i].index+headings[i][0].length;

      const bodyEnd=i+1<headings.length

        ?headings[i+1].index:section.length;

      return {

        type,

        body:section.slice(bodyStart,bodyEnd)

      };

    }

  }

  return null;

}

function detectGender(body){

  const first=body.slice(0,3500);

  const templates=[

    ...first.matchAll(/\{\{\s*fr-nom\s*\|([^}]+)\}\}/gi)

  ];

  for(const match of templates){

    const args=match[1].split('|').map(x=>x.trim().toLowerCase());

    if(args.includes('mf')) return 'masculin ou féminin';

    if(args.includes('f')) return 'féminin';

    if(args.includes('m')) return 'masculin';

  }

  if(/\{\{f\}\}/i.test(first)) return 'féminin';

  if(/\{\{m\}\}/i.test(first)) return 'masculin';

  return null;

}

function showAnswer(word,data){

  const isNoun=data.type==='Nom commun';

  const gender=data.gender;

  const article=gender==='féminin'?'Une ':

    gender==='masculin'?'Un ':'';

  const answer=isNoun&&gender

    ?article+word

    :word;

  result.innerHTML=`

    <div class="result-card">

      <div class="result-label">RÉSULTAT TROUVÉ</div>

      <div class="answer">${escapeHTML(answer)}</div>

      <div class="pills">

        <span class="pill ${isNoun?'green':''}">

          ${escapeHTML(data.type)}

        </span>

        ${gender?`<span class="pill">${escapeHTML(gender)}</span>`:''}

      </div>

      ${isNoun&&!gender?

        '<div class="detail">Genre non confirmé dans la source consultée.</div>':''}

    </div>`;

}

async function getSuggestions(word){

  try{

    const data=await api({

      action:'opensearch',

      search:word,

      limit:6,

      namespace:0

    });

    const words=(data[1]||[])

      .filter(x=>normalize(x)!==normalize(word))

      .slice(0,5);

    suggestions.innerHTML=words.map(x=>`

      <button class="suggestion" data-pick="${escapeHTML(x)}">

        ${escapeHTML(x)}

      </button>

    `).join('');

  }catch(e){}

}

async function searchWord(value){

  const word=value.trim();

  if(!word){

    status.textContent='Écris un mot pour commencer.';

    return;

  }

  button.disabled=true;

  result.innerHTML='';

  suggestions.innerHTML='';

  status.innerHTML='<span class="loader"></span>Recherche en cours...';

  try{

    const exact=knownWords[normalize(word)];

    if(exact){

      showAnswer(word,exact);

      status.textContent='';

      return;

    }

    const data=await api({

      action:'parse',

      page:word,

      prop:'wikitext'

    });

    const wt=data.parse?.wikitext?.['*'];

    if(!wt){

      status.textContent='Mot introuvable. Voici des suggestions :';

      await getSuggestions(word);

      return;

    }

    const section=frenchSection(wt);

    const entry=getFirstFrenchClass(section);

    if(!entry){

      status.textContent='Aucune entrée grammaticale française fiable trouvée.';

      await getSuggestions(word);

      return;

    }

    const gender=entry.type==='Nom commun'

      ?detectGender(entry.body):null;

    showAnswer(word,{

      type:entry.type,

      gender

    });

    status.textContent='';

  }catch(e){

    status.textContent='Impossible de contacter le dictionnaire. Réessaie dans un instant.';

  }finally{

    button.disabled=false;

  }

}

button.addEventListener('click',()=>searchWord(input.value));

input.addEventListener('keydown',e=>{

  if(e.key==='Enter') searchWord(input.value);

});

document.querySelectorAll('.example').forEach(b=>{

  b.addEventListener('click',()=>{

    input.value=b.dataset.word;

    searchWord(input.value);

  });

});

suggestions.addEventListener('click',e=>{

  const b=e.target.closest('[data-pick]');

  if(b){

    input.value=b.dataset.pick;

    searchWord(input.value);

  }

});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){

  window.addEventListener('load',()=>{

    navigator.serviceWorker.register('./sw.js').catch(()=>{});

  });

}

</script>

</body>

</html>
